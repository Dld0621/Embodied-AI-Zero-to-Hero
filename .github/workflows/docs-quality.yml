name: Docs quality

on:
  pull_request:
    paths:
      - "**/*.md"
      - "docs/stylesheets/**"
      - "docs/assets/**"
      - "docs/knowledge-system/**"
      - "assets/**"
      - "knowledge/**"
      - "pipelines/manifest.json"
      - "results/benchmarks/**"
      - "scripts/audit_repository.py"
      - "scripts/run_knowledge_map.py"
      - "scripts/check_claims.py"
      - "scripts/check_markdown_format.py"
      - "scripts/check_markdown_links.py"
      - "tools/robotdev/**"
      - "tests/test_robotdev_setup.py"
      - "tests/test_knowledge_system.py"
      - "tests/test_repository_audit.py"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "CITATION.cff"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/docs-quality.yml"
  push:
    branches: [master]
    paths:
      - "**/*.md"
      - "docs/stylesheets/**"
      - "docs/assets/**"
      - "docs/knowledge-system/**"
      - "assets/**"
      - "knowledge/**"
      - "pipelines/manifest.json"
      - "results/benchmarks/**"
      - "scripts/audit_repository.py"
      - "scripts/run_knowledge_map.py"
      - "scripts/check_claims.py"
      - "scripts/check_markdown_format.py"
      - "scripts/check_markdown_links.py"
      - "tools/robotdev/**"
      - "tests/test_robotdev_setup.py"
      - "tests/test_knowledge_system.py"
      - "tests/test_repository_audit.py"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "CITATION.cff"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - "THIRD_PARTY_NOTICES.md"

permissions:
  contents: read

jobs:
  repository-links:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check local Markdown links and assets
        run: python scripts/check_markdown_links.py
      - name: Check known inaccurate claims and evidence labels
        run: python scripts/check_claims.py
      - name: Check first-party Markdown format
        run: python scripts/check_markdown_format.py
      - name: Validate bilingual knowledge graph
        run: python scripts/run_knowledge_map.py --validate
      - name: Audit repository contracts and benchmark evidence
        run: python scripts/audit_repository.py

  documentation-site:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Build documentation site in strict mode
        run: python -m mkdocs build --strict --clean
