name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  content-and-static-quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pinned static checker
        run: python -m pip install ruff==0.16.3
      - name: Reject Python undefined names
        run: ruff check benchmarks datasets examples scripts tests tutorials --select F821
      - name: Check scientific-claim regressions
        run: python scripts/check_claims.py
      - name: Check first-party Markdown format
        run: python scripts/check_markdown_format.py

  smoke-tests:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test-lock.txt
      - name: Run smoke tests
        run: python -m pytest tests/ -v
      - name: Run deterministic benchmark
        run: |
          cd benchmarks
          python run_benchmark.py 100 42 --check

  rl-smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install RL dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-rl.txt
      - name: Verify Gymnasium-Robotics env creation
        run: |
          python -c "
          import gymnasium as gym
          import gymnasium_robotics
          gym.register_envs(gymnasium_robotics)
          env = gym.make('HandReach-v1')
          obs, info = env.reset(seed=42)
          obs, reward, terminated, truncated, info = env.step(env.action_space.sample())
          print(f'HandReach-v1: obs_shape={obs[\"observation\"].shape}, reward={reward:.4f}, terminated={terminated}')
          env.close()
          "
      - name: RL demo mode (numpy, no GPU)
        run: |
          cd examples
          python rl_demo.py --mode demo --task reach

  wm-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install WM dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-wm.txt
          pip install pytest==9.1.1
      - name: Run WM pipeline smoke test
        run: python -m pytest tests/test_wm_smoke.py -v

  lock-vla:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install VLA locked dependencies
        run: |
          python -m pip install --upgrade pip
          # Note: SmolVLA extra requirement is included via requirements-vla-lock.txt
          # Alternative: pip install lerobot[smolvla] from PyPI
          pip install -r requirements-vla-lock.txt
      - name: Verify VLA imports
        run: |
          python -c "import torch; print(f'torch {torch.__version__}')"
          python -c "import transformers; print(f'transformers {transformers.__version__}')"
          python -c "import lerobot; print(f'lerobot {lerobot.__version__}')"
      - name: Run Toy VLA training
        run: |
          cd examples
          python vla_01_toy_training.py
      - name: Verify SmolVLA API imports
        run: |
          python -c "
          from lerobot.policies.smolvla.modeling_smolvla import SmolVLAPolicy
          from lerobot.datasets.lerobot_dataset import LeRobotDataset
          print('SmolVLA API import OK')
          "

  lock-wm:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install WM locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-wm-lock.txt
          pip install pytest==9.1.1
      - name: Run WM smoke test with locked deps
        run: python -m pytest tests/test_wm_smoke.py -v

  pushcube-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Split install: pyyaml/pytest are NOT on the PyTorch wheel index.
          # --index-url replaces the default PyPI entirely, so packages not
          # on download.pytorch.org/whl/cpu would fail to install.
          pip install numpy==1.26.4 pytest==9.1.1
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: PushCube env self-test
        run: |
          cd examples
          python unified_pushcube_env.py
      - name: PushCube RL smoke test
        run: |
          cd examples
          python unified_pushcube_rl.py --smoke-test
      - name: PushCube VLA smoke test
        run: |
          cd examples
          python unified_pushcube_vla.py --smoke-test --no-ablation
      - name: PushCube World Model smoke test
        run: |
          cd examples
          python unified_pushcube_wm.py --smoke-test
      - name: PushCube Action-Chunking Policy smoke test
        run: |
          cd examples
          python unified_pushcube_act.py --smoke-test
      - name: PushCube Diffusion Policy smoke test
        run: |
          cd examples
          python unified_pushcube_diffusion.py --smoke-test
      - name: PushCube regression tests
        run: |
          python -m pytest tests/test_pushcube_regression.py tests/test_rfm_dataset_regression.py -v

  rfm-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Split install: pyyaml is NOT on the PyTorch wheel index.
          # --index-url replaces the default PyPI entirely, so pyyaml
          # would fail to install if bundled with the torch command.
          pip install numpy==1.26.4 pyyaml==6.0.3
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: RFM common interface test
        run: |
          cd examples/robot_foundation_models
          python -c "
          from common import RobotObservation, ActionChunk, RobotFoundationModel, EmbodimentAdapter, SafetyFilter
          import numpy as np
          obs = RobotObservation(
              images={'front': np.zeros((128,128,3), dtype=np.uint8)},
              state=np.zeros(7, dtype=np.float32),
              language_instruction='push the red cube',
              timestamp=0.0,
          )
          chunk = ActionChunk(
              actions=np.zeros((10,7), dtype=np.float32),
              action_type='joint_position',
              control_frequency=20.0,
          )
          print(f'Observation: {obs}')
          print(f'ActionChunk: {chunk}')
          print('RFM interface test passed')
          "
      - name: SmolVLA adapter smoke test (mock mode)
        run: |
          cd examples/robot_foundation_models/smolvla
          python inference.py
      - name: OpenVLA adapter smoke test (mock mode)
        run: |
          cd examples/robot_foundation_models/openvla
          python inference.py
      - name: Rule-based planner test
        run: |
          cd examples/robot_foundation_models/planners
          python rule_based_planner.py
      - name: RFM offline benchmark (mock, smoke-test)
        run: |
          python benchmarks/robot_foundation_models/evaluate_offline.py --mock --smoke-test
      - name: RFM closed-loop benchmark (mock, smoke-test)
        run: |
          python benchmarks/robot_foundation_models/evaluate_closed_loop.py --mock --smoke-test
      - name: RFM language ablation (mock, smoke-test)
        run: |
          python benchmarks/robot_foundation_models/language_ablation.py --mock --smoke-test
      - name: RFM canonical dataset smoke test
        run: |
          cd examples/robot_foundation_models/common
          python canonical_dataset.py
      - name: RFM to_lerobot converter smoke test
        run: |
          cd examples/robot_foundation_models/common
          python to_lerobot.py
      - name: RFM to_rlds converter smoke test
        run: |
          cd examples/robot_foundation_models/common
          python to_rlds.py
      - name: RFM PushCube dataset collector smoke test
        run: |
          cd examples/robot_foundation_models/smolvla
          python collect_pushcube_dataset.py --n_episodes 2 --output /tmp/pushcube_smoke/
      - name: SmolVLA config and CLI tests
        run: |
          cd examples/robot_foundation_models/smolvla
          python finetune.py --test
      - name: RFM SmolVLA mock fine-tuning smoke test
        run: |
          cd examples/robot_foundation_models/smolvla
          python finetune.py --mock --dataset_dir /tmp/pushcube_smoke/ --smoke_test
      - name: RFM SmolVLA closed-loop eval smoke test
        run: |
          cd examples/robot_foundation_models/smolvla
          python closed_loop_eval.py --mock --n_episodes 2
      - name: RFM Octo adapter smoke test
        run: |
          cd examples/robot_foundation_models/octo
          python inference.py
      - name: RFM GR00T adapter smoke test
        run: |
          cd examples/robot_foundation_models/groot
          python inference_pipeline_mock.py
      - name: RFM cross-embodiment eval smoke test
        run: |
          python benchmarks/robot_foundation_models/cross_embodiment_eval.py --mock --smoke-test

  lock-rl:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install RL locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-rl-lock.txt
      - name: Verify Gymnasium-Robotics env creation with locked deps
        run: |
          python -c "
          import gymnasium as gym
          import gymnasium_robotics
          gym.register_envs(gymnasium_robotics)
          env = gym.make('HandReach-v1')
          obs, info = env.reset(seed=42)
          obs, reward, terminated, truncated, info = env.step(env.action_space.sample())
          print(f'HandReach-v1: obs_shape={obs[\"observation\"].shape}, reward={reward:.4f}')
          env.close()
          "
      - name: Verify Pendulum-v1 compatibility (MlpPolicy, no HER)
        run: |
          python -c "
          import gymnasium as gym
          env = gym.make('Pendulum-v1')
          obs, info = env.reset(seed=42)
          print(f'Pendulum-v1: obs_space={env.observation_space}, action_space={env.action_space}')
          env.close()
          "
      - name: RL branch execution test (Pendulum, 20 steps)
        run: |
          cd examples
          python rl_demo.py --mode train --env Pendulum-v1 --timesteps 20 --model-name ci_pendulum --log-dir /tmp/ci_pendulum --seed 42
      - name: RL branch execution test (HandReach, 20 steps)
        run: |
          cd examples
          python rl_demo.py --mode train --env HandReach-v1 --timesteps 20 --model-name ci_handreach --log-dir /tmp/ci_handreach --seed 42

  foundations-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Core deps for Foundations tests: numpy, scipy, pytest, matplotlib
          pip install -r requirements-test-lock.txt
          # torch (CPU) for deep-learning / transformer / dataset code-snippet tests
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # mujoco is pinned by requirements-test-lock.txt for the simulation-loop test
      - name: Run Foundations Layer verification tests
        run: |
          python -m pytest tests/foundations/ -v --tb=short
