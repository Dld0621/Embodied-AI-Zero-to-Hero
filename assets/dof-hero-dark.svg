<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Learn the loop. Build the evidence.</title>
  <desc id="desc">A minimal dark interface presenting the embodied intelligence feedback loop and the repository learning system.</desc>
  <defs>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6F8FFF"/><stop offset=".52" stop-color="#A989FF"/><stop offset="1" stop-color="#48C6D5"/></linearGradient>
    <radialGradient id="wash" cx="0" cy="0" r="1" gradientTransform="translate(1260 292) rotate(135) scale(445)"><stop stop-color="#263C77" stop-opacity=".58"/><stop offset=".5" stop-color="#241D4B" stop-opacity=".34"/><stop offset="1" stop-color="#080B11" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#A9B5C8" stroke-opacity=".06"/></pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="22" stdDeviation="30" flood-color="#000000" flood-opacity=".42"/></filter>
    <style>.s{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.eyebrow{font-size:14px;font-weight:720;letter-spacing:2.2px;fill:#A3AEC0}.display{font-size:72px;font-weight:690;letter-spacing:-3.7px;fill:#F6F8FC}.body{font-size:22px;font-weight:450;fill:#9CA8BA}.label{font-size:12px;font-weight:720;letter-spacing:1.55px;fill:#929DB0}.node{font-size:14px;font-weight:700;fill:#D3DAE6}.core{font-size:18px;font-weight:700;fill:#F2F5FA}.metric{font-size:27px;font-weight:720;fill:#F4F6FA}.metricLabel{font-size:11px;font-weight:720;letter-spacing:1.2px;fill:#8C98AB}</style>
  </defs>
  <rect width="1600" height="720" rx="48" fill="#080B11"/><rect x="1" y="1" width="1598" height="718" rx="47" fill="none" stroke="#242C38" stroke-width="2"/><rect width="1600" height="720" rx="48" fill="url(#grid)"/><circle cx="1260" cy="292" r="445" fill="url(#wash)"/>
  <g class="s">
    <g transform="translate(82 64)"><circle cx="6" cy="-5" r="6" fill="#6F8FFF"/><text x="25" class="eyebrow">EMBODIED INTELLIGENCE · LEARNING + RESEARCH</text></g>
    <text x="82" y="178" class="display">Learn the loop.</text><text x="82" y="258" class="display">Build the evidence.</text><rect x="82" y="292" width="116" height="6" rx="3" fill="url(#signal)"/>
    <text x="82" y="354" class="body">A connected path from first principles to closed-loop systems,</text><text x="82" y="387" class="body">measured experiments, and guarded deployment.</text>
    <g transform="translate(1168 288)" filter="url(#soft)"><circle r="184" fill="#0E141E" fill-opacity=".82" stroke="#39465B"/><circle r="130" fill="none" stroke="#52617A" stroke-opacity=".8" stroke-dasharray="3 9"/><circle r="73" fill="#101722" stroke="#3B4658"/><circle r="54" fill="url(#signal)" opacity=".14"/><text y="-5" text-anchor="middle" class="core">TASK LOOP</text><text y="20" text-anchor="middle" class="label">EVIDENCE-GATED</text></g>
    <path d="M1168 104a184 184 0 0 1 184 184" fill="none" stroke="url(#signal)" stroke-width="4" stroke-linecap="round"/><path d="M1352 288a184 184 0 0 1-184 184" fill="none" stroke="url(#signal)" stroke-width="4" stroke-linecap="round" opacity=".72"/><path d="M1168 472A184 184 0 0 1 984 288" fill="none" stroke="url(#signal)" stroke-width="4" stroke-linecap="round" opacity=".5"/><path d="M984 288a184 184 0 0 1 184-184" fill="none" stroke="url(#signal)" stroke-width="4" stroke-linecap="round" opacity=".3"/>
    <g><circle cx="1168" cy="104" r="10" fill="#6F8FFF"/><text x="1168" y="76" text-anchor="middle" class="node">OBSERVE</text><circle cx="1352" cy="288" r="10" fill="#A989FF"/><text x="1380" y="293" class="node">REASON</text><circle cx="1168" cy="472" r="10" fill="#48C6D5"/><text x="1168" y="505" text-anchor="middle" class="node">ACT</text><circle cx="984" cy="288" r="10" fill="#FF9B72"/><text x="956" y="293" text-anchor="end" class="node">EVALUATE</text></g>
    <path d="M1333 213l18 5-14 12" fill="none" stroke="#A989FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(82 588)"><path d="M0-31H1436" stroke="#2B3442"/><g><text y="0" class="metric">45</text><text y="24" class="metricLabel">KNOWLEDGE NODES</text></g><g transform="translate(246)"><text y="0" class="metric">9</text><text y="24" class="metricLabel">DOMAINS</text></g><g transform="translate(450)"><text y="0" class="metric">14</text><text y="24" class="metricLabel">LESSONS</text></g><g transform="translate(662)"><text y="0" class="metric">11</text><text y="24" class="metricLabel">PIPELINES</text></g><g transform="translate(885)"><text y="0" class="metric">7</text><text y="24" class="metricLabel">RESEARCH ROUTES</text></g><g transform="translate(1170)"><circle cy="-8" r="5" fill="#4FD39A"/><text x="16" y="-3" class="label">8 SMOKE-TESTED PATHS</text><text x="16" y="24" class="metricLabel">STATUS · NOT PERFORMANCE</text></g></g>
  </g>
</svg>
