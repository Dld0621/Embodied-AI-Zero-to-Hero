<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Learn the loop. Build the evidence.</title>
  <desc id="desc">A minimal light interface presenting the embodied intelligence feedback loop and the repository learning system.</desc>
  <defs>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#315CFF"/><stop offset=".52" stop-color="#7657F6"/><stop offset="1" stop-color="#15A7B8"/></linearGradient>
    <radialGradient id="wash" cx="0" cy="0" r="1" gradientTransform="translate(1260 292) rotate(135) scale(430)"><stop stop-color="#DCE5FF" stop-opacity=".9"/><stop offset=".48" stop-color="#EDEBFF" stop-opacity=".52"/><stop offset="1" stop-color="#F7F8FC" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#65738A" stroke-opacity=".08"/></pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#36507F" flood-opacity=".16"/></filter>
    <style>.s{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.eyebrow{font-size:14px;font-weight:720;letter-spacing:2.2px;fill:#536074}.display{font-size:72px;font-weight:690;letter-spacing:-3.7px;fill:#0C111B}.body{font-size:22px;font-weight:450;fill:#687487}.label{font-size:12px;font-weight:720;letter-spacing:1.55px;fill:#667286}.node{font-size:14px;font-weight:700;fill:#283446}.core{font-size:18px;font-weight:700;fill:#121A28}.metric{font-size:27px;font-weight:720;fill:#111827}.metricLabel{font-size:11px;font-weight:720;letter-spacing:1.2px;fill:#788397}</style>
  </defs>
  <rect width="1600" height="720" rx="48" fill="#F7F8FC"/><rect x="1" y="1" width="1598" height="718" rx="47" fill="none" stroke="#DFE4EC" stroke-width="2"/><rect width="1600" height="720" rx="48" fill="url(#grid)"/><circle cx="1260" cy="292" r="430" fill="url(#wash)"/>
  <g class="s">
    <g transform="translate(82 64)"><circle cx="6" cy="-5" r="6" fill="#315CFF"/><text x="25" class="eyebrow">EMBODIED INTELLIGENCE · LEARNING + RESEARCH</text></g>
    <text x="82" y="178" class="display">Learn the loop.</text><text x="82" y="258" class="display">Build the evidence.</text><rect x="82" y="292" width="116" height="6" rx="3" fill="url(#signal)"/>
    <text x="82" y="354" class="body">A connected path from first principles to closed-loop systems,</text><text x="82" y="387" class="body">measured experiments, and guarded deployment.</text>
    <g transform="translate(1168 288)" filter="url(#soft)"><circle r="184" fill="#FFFFFF" fill-opacity=".66" stroke="#CBD3E1"/><circle r="130" fill="none" stroke="#A8B5CC" stroke-opacity=".7" stroke-dasharray="3 9"/><circle r="73" fill="#FFFFFF" stroke="#D4DAE5"/><circle r="54" fill="url(#signal)" opacity=".1"/><text y="-5" text-anchor="middle" class="core">TASK LOOP</text><text y="20" text-anchor="middle" class="label">EVIDENCE-GATED</text></g>
    <path d="M1168 104a184 184 0 0 1 184 184" fill="none" stroke="url(#signal)" stroke-width="4" stroke-linecap="round"/><path d="M1352 288a184 184 0 0 1-184 184" fill="none" stroke="url(#signal)" stroke-width="4" stroke-linecap="round" opacity=".68"/><path d="M1168 472A184 184 0 0 1 984 288" fill="none" stroke="url(#signal)" stroke-width="4" stroke-linecap="round" opacity=".42"/><path d="M984 288a184 184 0 0 1 184-184" fill="none" stroke="url(#signal)" stroke-width="4" stroke-linecap="round" opacity=".22"/>
    <g><circle cx="1168" cy="104" r="10" fill="#315CFF"/><text x="1168" y="76" text-anchor="middle" class="node">OBSERVE</text><circle cx="1352" cy="288" r="10" fill="#7657F6"/><text x="1380" y="293" class="node">REASON</text><circle cx="1168" cy="472" r="10" fill="#15A7B8"/><text x="1168" y="505" text-anchor="middle" class="node">ACT</text><circle cx="984" cy="288" r="10" fill="#F08A5D"/><text x="956" y="293" text-anchor="end" class="node">EVALUATE</text></g>
    <path d="M1333 213l18 5-14 12" fill="none" stroke="#7657F6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(82 588)"><path d="M0-31H1436" stroke="#D9DEE7"/><g><text y="0" class="metric">45</text><text y="24" class="metricLabel">KNOWLEDGE NODES</text></g><g transform="translate(246)"><text y="0" class="metric">9</text><text y="24" class="metricLabel">DOMAINS</text></g><g transform="translate(450)"><text y="0" class="metric">14</text><text y="24" class="metricLabel">LESSONS</text></g><g transform="translate(662)"><text y="0" class="metric">11</text><text y="24" class="metricLabel">PIPELINES</text></g><g transform="translate(885)"><text y="0" class="metric">7</text><text y="24" class="metricLabel">RESEARCH ROUTES</text></g><g transform="translate(1170)"><circle cy="-8" r="5" fill="#23A66F"/><text x="16" y="-3" class="label">8 SMOKE-TESTED PATHS</text><text x="16" y="24" class="metricLabel">STATUS · NOT PERFORMANCE</text></g></g>
  </g>
</svg>
