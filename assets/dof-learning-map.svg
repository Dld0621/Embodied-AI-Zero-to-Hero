    <radialGradient id="wash" cx="0" cy="0" r="1" gradientTransform="translate(1110 40) rotate(145) scale(520 340)"><stop stop-color="#233766" stop-opacity=".54"/><stop offset="1" stop-color="#070A0F" stop-opacity="0"/></radialGradient>
    <style>.s{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.k{font-size:14px;font-weight:720;letter-spacing:2.2px;fill:#9BA6B8}.h{font-size:40px;font-weight:680;letter-spacing:-1.6px;fill:#F5F7FB}.verb{font-size:28px;font-weight:680;letter-spacing:-.7px;fill:#F3F5F9}.body{font-size:15px;font-weight:500;fill:#929DAF}.num{font-size:14px;font-weight:720;letter-spacing:1.5px;fill:#7D899C}.tag{font-size:12px;font-weight:700;letter-spacing:1.4px;fill:#AAB3C2}</style>
