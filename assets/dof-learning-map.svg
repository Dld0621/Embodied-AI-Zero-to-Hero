<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc">
  <title id="title">Embodied AI learning system</title><desc id="desc">Five connected stages from first principles to guarded robot deployment.</desc>
