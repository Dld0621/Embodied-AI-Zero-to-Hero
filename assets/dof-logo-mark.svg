<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">DoF joint mark</title>
  <desc id="desc">A minimal rotational joint representing a degree of freedom.</desc>
  <defs>
    <linearGradient id="mark-gradient" x1="22" y1="20" x2="106" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="0.55" stop-color="#4F7CFF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <circle cx="64" cy="64" r="39" fill="none" stroke="url(#mark-gradient)" stroke-width="11"/>
  <circle cx="64" cy="64" r="8" fill="url(#mark-gradient)"/>
  <circle cx="91.5" cy="36.5" r="8" fill="#FFFFFF" stroke="#4F7CFF" stroke-width="5"/>
</svg>
