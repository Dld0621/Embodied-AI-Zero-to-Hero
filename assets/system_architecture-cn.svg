<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">DoF 具身智能系统架构</title>
  <desc id="desc">语言、视觉和机器人状态经过具身推理、VLA 策略、适配控制与安全过滤后驱动仿真或真实机器人，并由世界模型和强化学习形成反馈闭环。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050816"/><stop offset="1" stop-color="#0b1830"/></linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>.title{font:700 30px "Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;fill:#f8fafc}.label{font:700 18px "Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;fill:#f8fafc}.small{font:400 14px "Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;fill:#94a3b8}.tag{font:700 14px "Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;fill:#67e8f9;letter-spacing:1px}.box{fill:#0d1b33;stroke:#244469;stroke-width:1.5}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.feedback{fill:none;stroke:#8b5cf6;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1440" height="760" rx="28" fill="url(#bg)"/>
  <text x="70" y="68" class="tag">DOF · 从感知到行动</text>
  <text x="70" y="112" class="title">具身智能系统架构</text>
  <text x="70" y="145" class="small">策略、预测、优化与安全控制组成一个可验证的机器人闭环。</text>

  <g>
    <rect x="70" y="195" width="250" height="82" rx="16" class="box"/><text x="195" y="229" text-anchor="middle" class="label">语言指令</text><text x="195" y="255" text-anchor="middle" class="small">“把红色方块推向目标”</text>
    <rect x="350" y="195" width="250" height="82" rx="16" class="box"/><text x="475" y="229" text-anchor="middle" class="label">视觉观测</text><text x="475" y="255" text-anchor="middle" class="small">RGB · 深度 · 触觉</text>
    <rect x="630" y="195" width="250" height="82" rx="16" class="box"/><text x="755" y="229" text-anchor="middle" class="label">机器人状态</text><text x="755" y="255" text-anchor="middle" class="small">关节 · 位姿 · 任务状态</text>
    <path d="M195 277V312H475" class="line"/><path d="M475 277V312" class="line"/><path d="M755 277V312H475" class="line"/>

    <rect x="295" y="330" width="360" height="82" rx="18" class="box" stroke="#8b5cf6"/><text x="475" y="365" text-anchor="middle" class="label">具身推理器</text><text x="475" y="391" text-anchor="middle" class="small">任务分解 · 空间推理 · 子目标规划</text>
    <path d="M475 412V447" class="line"/>
    <rect x="295" y="465" width="360" height="82" rx="18" class="box" stroke="#22d3ee"/><text x="475" y="500" text-anchor="middle" class="label">VLA 策略</text><text x="475" y="526" text-anchor="middle" class="small">图像 + 语言 + 状态 → 动作序列</text>

    <rect x="70" y="605" width="250" height="82" rx="16" class="box"/><text x="195" y="639" text-anchor="middle" class="label">机器人适配器</text><text x="195" y="665" text-anchor="middle" class="small">通用动作 → 具体机器人</text>
    <rect x="350" y="605" width="250" height="82" rx="16" class="box"/><text x="475" y="639" text-anchor="middle" class="label">底层控制器</text><text x="475" y="665" text-anchor="middle" class="small">PID · 阻抗 · 关节伺服</text>
    <rect x="630" y="605" width="250" height="82" rx="16" class="box"/><text x="755" y="639" text-anchor="middle" class="label">安全过滤器</text><text x="755" y="665" text-anchor="middle" class="small">限位 · 碰撞 · 速度约束</text>
    <path d="M475 547V575H195V605" class="line"/><path d="M320 646H350" class="line"/><path d="M600 646H630" class="line"/>
  </g>

  <g>
    <rect x="980" y="195" width="380" height="105" rx="18" class="box" stroke="#a78bfa"/><text x="1170" y="233" text-anchor="middle" class="label">世界模型</text><text x="1170" y="260" text-anchor="middle" class="small">预测未来状态 · 奖励 · 风险</text><text x="1170" y="282" text-anchor="middle" class="small">为推理和规划提供想象轨迹</text>
    <rect x="980" y="345" width="380" height="105" rx="18" class="box" stroke="#60a5fa"/><text x="1170" y="383" text-anchor="middle" class="label">强化学习后训练</text><text x="1170" y="410" text-anchor="middle" class="small">交互数据 · 策略优化 · 偏好对齐</text><text x="1170" y="432" text-anchor="middle" class="small">提升成功率和泛化能力</text>
    <rect x="980" y="540" width="380" height="147" rx="18" fill="#10243e" stroke="url(#flow)" stroke-width="2.5"/><text x="1170" y="585" text-anchor="middle" class="label">仿真 / 真实机器人</text><text x="1170" y="617" text-anchor="middle" class="small">MuJoCo · PushCube · Franka · UR5e</text><text x="1170" y="645" text-anchor="middle" class="small">执行动作并返回观测、奖励与安全事件</text>
    <path d="M880 646H980" class="line"/>
    <path d="M1170 540V470Q1170 465 1165 465H900Q875 465 875 440V371H655" class="feedback"/>
    <path d="M1250 540V480Q1250 465 1235 465H1170V450" class="feedback"/>
    <path d="M980 247H900Q875 247 875 272V370H655" class="feedback"/>
  </g>

  <text x="70" y="728" class="small">基础层：Python · 数学 · 深度学习 · Transformer · 正/逆运动学 · 控制 · MuJoCo</text>
</svg>
