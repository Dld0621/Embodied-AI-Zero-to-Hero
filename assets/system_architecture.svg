<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Closed-loop embodied AI system</title><desc id="desc">Observations flow through perception, reasoning, policy, safety and control into simulation or a real robot, then return through evaluation and learning.</desc>
  <defs>
    <linearGradient id="flow" x1="88" y1="0" x2="1352" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#55D6F5"/><stop offset=".33" stop-color="#6D8CFF"/><stop offset=".62" stop-color="#B08CFF"/><stop offset="1" stop-color="#C8EE56"/></linearGradient>
    <radialGradient id="wash" cx="0" cy="0" r="1" gradientTransform="translate(1120 70) rotate(145) scale(560 380)"><stop stop-color="#273A70" stop-opacity=".5"/><stop offset="1" stop-color="#070A0F" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".3"/></filter>
    <style>.s{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.k{font-size:13px;font-weight:720;letter-spacing:2px;fill:#919CAF}.h{font-size:40px;font-weight:680;letter-spacing:-1.6px;fill:#F5F7FB}.card{fill:#10151E;stroke:#2A3442}.cardH{font-size:22px;font-weight:680;fill:#F3F5F9}.body{font-size:14px;font-weight:510;fill:#929DAF}.mini{font-size:12px;font-weight:700;letter-spacing:1px;fill:#AAB3C2}.num{font-size:13px;font-weight:720;letter-spacing:1.4px;fill:#778397}</style>
  </defs>
  <rect width="1440" height="760" rx="40" fill="#070A0F"/><rect x="1" y="1" width="1438" height="758" rx="39" fill="none" stroke="#242C38" stroke-width="2"/><rect width="1440" height="760" rx="40" fill="url(#wash)"/>
  <g class="s">
    <text x="64" y="64" class="k">SYSTEM MAP · CLOSED-LOOP EMBODIED INTELLIGENCE</text><text x="64" y="116" class="h">Sense. Decide. Move. Improve.</text><text x="64" y="150" class="body">A single contract connects multimodal observations to bounded action and reproducible evidence.</text>
    <g transform="translate(64 190)"><rect width="188" height="42" rx="21" fill="#101923" stroke="#24404A"/><circle cx="24" cy="21" r="6" fill="#55D6F5"/><text x="42" y="26" class="mini">RGB / DEPTH</text></g>
    <g transform="translate(266 190)"><rect width="188" height="42" rx="21" fill="#111722" stroke="#2E3B55"/><circle cx="24" cy="21" r="6" fill="#6D8CFF"/><text x="42" y="26" class="mini">LANGUAGE</text></g>
    <g transform="translate(468 190)"><rect width="188" height="42" rx="21" fill="#151622" stroke="#3A3150"/><circle cx="24" cy="21" r="6" fill="#B08CFF"/><text x="42" y="26" class="mini">ROBOT STATE</text></g>
    <g transform="translate(670 190)"><rect width="220" height="42" rx="21" fill="#191820" stroke="#4B342E"/><circle cx="24" cy="21" r="6" fill="#FF9F7A"/><text x="42" y="26" class="mini">TASK CONTEXT</text></g>

    <path d="M90 275H1350" stroke="#252E3B" stroke-width="8" stroke-linecap="round"/><path d="M90 275H1350" stroke="url(#flow)" stroke-width="3" stroke-linecap="round"/>
    <g filter="url(#shadow)">
      <g transform="translate(64 310)"><rect width="260" height="220" rx="28" class="card"/><text x="28" y="40" class="num">01 · PERCEPTION</text><text x="28" y="84" class="cardH">Synchronize</text><text x="28" y="114" class="body">Calibrated observations</text><rect x="28" y="142" width="204" height="50" rx="16" fill="#14222B" stroke="#23414C"/><text x="46" y="172" class="mini">ENCODER · FUSION</text></g>
      <g transform="translate(344 310)"><rect width="396" height="220" rx="28" class="card"/><text x="28" y="40" class="num">02 · INTELLIGENCE</text><text x="28" y="84" class="cardH">Reason + predict</text><g transform="translate(28 112)"><rect width="103" height="80" rx="16" fill="#171D2C" stroke="#2C3B64"/><text x="16" y="31" class="mini">REASONER</text><text x="16" y="56" class="body">task plan</text></g><g transform="translate(143 112)"><rect width="103" height="80" rx="16" fill="#1B192B" stroke="#443466"/><text x="16" y="31" class="mini">VLA</text><text x="16" y="56" class="body">policy</text></g><g transform="translate(258 112)"><rect width="110" height="80" rx="16" fill="#201A24" stroke="#5A3A43"/><text x="16" y="31" class="mini">WORLD</text><text x="16" y="56" class="body">model + risk</text></g></g>
      <g transform="translate(760 310)"><rect width="300" height="220" rx="28" class="card"/><text x="28" y="40" class="num">03 · EXECUTION</text><text x="28" y="84" class="cardH">Bound action</text><g transform="translate(28 112)"><rect width="244" height="36" rx="12" fill="#201A26" stroke="#4B3657"/><text x="18" y="23" class="mini">EMBODIMENT ADAPTER</text></g><g transform="translate(28 160)"><rect width="116" height="32" rx="11" fill="#20251A" stroke="#3B4B28"/><text x="16" y="21" class="mini">SAFETY</text><rect x="128" width="116" height="32" rx="11" fill="#182027" stroke="#2D4351"/><text x="144" y="21" class="mini">CONTROL</text></g></g>
      <g transform="translate(1080 310)"><rect width="296" height="220" rx="28" class="card"/><text x="28" y="40" class="num">04 · ENVIRONMENT</text><text x="28" y="84" class="cardH">Interact</text><text x="28" y="114" class="body">Simulation or real robot</text><g transform="translate(28 142)"><rect width="112" height="50" rx="16" fill="#152329" stroke="#2A4550"/><text x="56" y="31" text-anchor="middle" class="mini">MUJOCO</text><rect x="128" width="112" height="50" rx="16" fill="#20261A" stroke="#405029"/><text x="184" y="31" text-anchor="middle" class="mini">ROBOT</text></g></g>
    </g>

    <path d="M1280 550C1280 602 1170 626 1060 626H220C120 626 80 594 80 548" fill="none" stroke="url(#flow)" stroke-width="3" stroke-linecap="round"/><path d="M80 548l-9 17 19-1" fill="none" stroke="#55D6F5" stroke-width="3" stroke-linejoin="round"/>
    <g transform="translate(154 600)"><text class="mini">OBSERVE</text><circle cx="104" cy="-5" r="3" fill="#3C4655"/><text x="126" class="mini">RECORD</text><circle cx="225" cy="-5" r="3" fill="#3C4655"/><text x="247" class="mini">EVALUATE</text><circle cx="360" cy="-5" r="3" fill="#3C4655"/><text x="382" class="mini">TRAIN / ADAPT</text><circle cx="535" cy="-5" r="3" fill="#3C4655"/><text x="557" class="mini">PROMOTE</text></g>
    <g transform="translate(64 688)"><rect width="1312" height="36" rx="18" fill="#0E131B" stroke="#232C38"/><circle cx="20" cy="18" r="5" fill="#6D8CFF"/><text x="38" y="23" class="mini">FOUNDATION PLANE</text><text x="212" y="23" class="body">14 lessons · geometry · learning · sensing · control · systems · evaluation</text><text x="1278" y="23" text-anchor="end" class="num">EVIDENCE BEFORE CLAIMS</text></g>
  </g>
</svg>
