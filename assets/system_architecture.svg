<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700" role="img" aria-labelledby="title desc">
  <title id="title">Closed-loop embodied intelligence system</title>
  <desc id="desc">Multimodal observations flow through perception, intelligence, execution and environment interaction, then return as evidence and learning.</desc>
  <defs>
    <linearGradient id="flow" x1="82" y1="0" x2="1358" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#15A7B8"/><stop offset=".34" stop-color="#315CFF"/><stop offset=".67" stop-color="#7657F6"/><stop offset="1" stop-color="#23A66F"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#304466" flood-opacity=".12"/></filter>
    <style>
      .s{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.bg{fill:#F8F9FB}.border{fill:none;stroke:#DEE4EC}.grid{stroke:#7A879A;stroke-opacity:.07}.eyebrow{font-size:13px;font-weight:720;letter-spacing:2px;fill:#647084}.h{font-size:38px;font-weight:690;letter-spacing:-1.4px;fill:#111722}.body{font-size:15px;font-weight:480;fill:#6E798B}.card{fill:#FFFFFF;stroke:#DDE3EC}.cardH{font-size:21px;font-weight:700;fill:#172030}.small{font-size:12px;font-weight:700;letter-spacing:1.1px;fill:#778296}.chip{fill:#F3F5F8;stroke:#DDE3EB}.chipText{font-size:12px;font-weight:680;fill:#4F5C70}.footer{fill:#F0F3F7;stroke:#DCE2EA}.strong{font-size:13px;font-weight:720;fill:#2E3A4E}.line{stroke:#CED6E2}.num{font-size:12px;font-weight:740;letter-spacing:1.3px;fill:#758196}
      @media (prefers-color-scheme:dark){.bg{fill:#090C12}.border{stroke:#242D3A}.grid{stroke:#B5C0D2;stroke-opacity:.05}.eyebrow{fill:#9BA7BA}.h{fill:#F4F6FA}.body{fill:#96A2B5}.card{fill:#111720;stroke:#2B3543}.cardH{fill:#F0F3F8}.small{fill:#8D99AC}.chip{fill:#151C26;stroke:#303B4A}.chipText{fill:#ABB5C4}.footer{fill:#0F151E;stroke:#283240}.strong{fill:#CFD6E2}.line{stroke:#303B49}.num{fill:#8490A3}}
    </style>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" class="grid"/></pattern>
  </defs>
  <rect width="1440" height="700" rx="40" class="bg"/><rect x="1" y="1" width="1438" height="698" rx="39" class="border" stroke-width="2"/><rect width="1440" height="700" rx="40" fill="url(#grid)"/>
  <g class="s">
    <text x="64" y="61" class="eyebrow">SYSTEM MAP · ONE CONTRACT, ONE FEEDBACK LOOP</text><text x="64" y="112" class="h">Observe. Decide. Act. Measure.</text><text x="64" y="143" class="body">Every layer exposes an input, output, uncertainty, metric, and promotion boundary.</text>
    <g transform="translate(64 180)"><g><rect width="154" height="36" rx="18" class="chip"/><circle cx="20" cy="18" r="5" fill="#15A7B8"/><text x="34" y="22" class="chipText">RGB / DEPTH</text></g><g transform="translate(166)"><rect width="140" height="36" rx="18" class="chip"/><circle cx="20" cy="18" r="5" fill="#315CFF"/><text x="34" y="22" class="chipText">LANGUAGE</text></g><g transform="translate(318)"><rect width="158" height="36" rx="18" class="chip"/><circle cx="20" cy="18" r="5" fill="#7657F6"/><text x="34" y="22" class="chipText">ROBOT STATE</text></g><g transform="translate(488)"><rect width="166" height="36" rx="18" class="chip"/><circle cx="20" cy="18" r="5" fill="#F08A5D"/><text x="34" y="22" class="chipText">TASK CONTEXT</text></g></g>
    <path d="M82 256H1358" stroke="url(#flow)" stroke-width="4" stroke-linecap="round"/><path d="M1340 247l18 9-18 9" fill="none" stroke="#23A66F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g filter="url(#shadow)">
      <g transform="translate(64 286)"><rect width="276" height="214" rx="24" class="card"/><text x="24" y="35" class="num">01 · PERCEPTION</text><text x="24" y="74" class="cardH">Make state observable</text><text x="24" y="102" class="body">calibrate · synchronize · fuse</text><path d="M24 126H252" class="line"/><g transform="translate(24 146)"><rect width="106" height="42" rx="12" class="chip"/><text x="53" y="26" text-anchor="middle" class="chipText">ENCODER</text><rect x="122" width="130" height="42" rx="12" class="chip"/><text x="187" y="26" text-anchor="middle" class="chipText">ESTIMATOR</text></g></g>
      <g transform="translate(360 286)"><rect width="354" height="214" rx="24" class="card"/><text x="24" y="35" class="num">02 · INTELLIGENCE</text><text x="24" y="74" class="cardH">Choose and predict</text><text x="24" y="102" class="body">goal · plan · policy · consequence</text><path d="M24 126H330" class="line"/><g transform="translate(24 146)"><rect width="90" height="42" rx="12" class="chip"/><text x="45" y="26" text-anchor="middle" class="chipText">REASON</text><rect x="102" width="90" height="42" rx="12" class="chip"/><text x="147" y="26" text-anchor="middle" class="chipText">VLA</text><rect x="204" width="126" height="42" rx="12" class="chip"/><text x="267" y="26" text-anchor="middle" class="chipText">WORLD MODEL</text></g></g>
      <g transform="translate(734 286)"><rect width="276" height="214" rx="24" class="card"/><text x="24" y="35" class="num">03 · EXECUTION</text><text x="24" y="74" class="cardH">Bound the action</text><text x="24" y="102" class="body">adapt · filter · control</text><path d="M24 126H252" class="line"/><g transform="translate(24 146)"><rect width="106" height="42" rx="12" class="chip"/><text x="53" y="26" text-anchor="middle" class="chipText">SAFETY</text><rect x="122" width="130" height="42" rx="12" class="chip"/><text x="187" y="26" text-anchor="middle" class="chipText">CONTROLLER</text></g></g>
      <g transform="translate(1030 286)"><rect width="346" height="214" rx="24" class="card"/><text x="24" y="35" class="num">04 · ENVIRONMENT</text><text x="24" y="74" class="cardH">Interact and observe</text><text x="24" y="102" class="body">simulation · robot · world</text><path d="M24 126H322" class="line"/><g transform="translate(24 146)"><rect width="142" height="42" rx="12" class="chip"/><text x="71" y="26" text-anchor="middle" class="chipText">SIMULATOR</text><rect x="156" width="166" height="42" rx="12" class="chip"/><text x="239" y="26" text-anchor="middle" class="chipText">REAL ROBOT</text></g></g>
    </g>
    <path d="M1286 520v24c0 38-32 58-70 58H154c-44 0-72-22-72-60v-20" fill="none" stroke="url(#flow)" stroke-width="3" stroke-linecap="round"/><path d="M73 539l9-17 9 17" fill="none" stroke="#15A7B8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(244 576)"><text class="small">LOG</text><circle cx="54" cy="-4" r="3" fill="#A1ACBC"/><text x="70" class="small">EVALUATE</text><circle cx="166" cy="-4" r="3" fill="#A1ACBC"/><text x="182" class="small">DIAGNOSE</text><circle cx="286" cy="-4" r="3" fill="#A1ACBC"/><text x="302" class="small">TRAIN / ADAPT</text><circle cx="442" cy="-4" r="3" fill="#A1ACBC"/><text x="458" class="small">PROMOTE OR STOP</text></g>
    <g transform="translate(64 638)"><rect width="1312" height="38" rx="19" class="footer"/><circle cx="22" cy="19" r="5" fill="#315CFF"/><text x="38" y="24" class="strong">FOUNDATION PLANE</text><text x="204" y="24" class="body">geometry · mechanics · learning · sensing · control · systems · evaluation</text><text x="1286" y="24" text-anchor="end" class="strong">EVIDENCE BEFORE CLAIMS</text></g>
  </g>
</svg>
