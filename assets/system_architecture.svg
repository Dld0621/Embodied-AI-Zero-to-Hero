<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect width="900" height="520" rx="12" fill="#0d1117"/>

  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" font-size="18" font-weight="600" fill="#e6edf3">Embodied AI System Architecture</text>

  <!-- ============ INPUT LAYER ============ -->
  <!-- Language -->
  <rect x="60" y="70" width="140" height="46" rx="8" fill="#1c2333" stroke="#8B78F5" stroke-width="2"/>
  <text x="130" y="92" text-anchor="middle" font-size="13" fill="#8B78F5" font-weight="600">Language</text>
  <text x="130" y="108" text-anchor="middle" font-size="10" fill="#7d8590">"push the red cube"</text>

  <!-- Vision -->
  <rect x="220" y="70" width="140" height="46" rx="8" fill="#1c2333" stroke="#FF6B6B" stroke-width="2"/>
  <text x="290" y="92" text-anchor="middle" font-size="13" fill="#FF6B6B" font-weight="600">Vision (RGB)</text>
  <text x="290" y="108" text-anchor="middle" font-size="10" fill="#7d8590">128×128 image</text>

  <!-- State -->
  <rect x="380" y="70" width="140" height="46" rx="8" fill="#1c2333" stroke="#4ECDC4" stroke-width="2"/>
  <text x="450" y="92" text-anchor="middle" font-size="13" fill="#4ECDC4" font-weight="600">Robot State</text>
  <text x="450" y="108" text-anchor="middle" font-size="10" fill="#7d8590">14-D structured task state</text>

  <!-- Arrows from inputs to reasoner -->
  <line x1="130" y1="116" x2="130" y2="145" stroke="#7d8590" stroke-width="1.5"/>
  <line x1="290" y1="116" x2="290" y2="145" stroke="#7d8590" stroke-width="1.5"/>
  <line x1="450" y1="116" x2="450" y2="145" stroke="#7d8590" stroke-width="1.5"/>

  <!-- Merge lines -->
  <line x1="130" y1="145" x2="450" y2="145" stroke="#7d8590" stroke-width="1.5"/>
  <line x1="290" y1="145" x2="290" y2="170" stroke="#7d8590" stroke-width="1.5"/>

  <!-- ============ EMBODIED REASONER ============ -->
  <rect x="180" y="170" width="300" height="50" rx="8" fill="#1c2333" stroke="#9B59B6" stroke-width="2"/>
  <text x="330" y="193" text-anchor="middle" font-size="14" fill="#9B59B6" font-weight="600">Embodied Reasoner</text>
  <text x="330" y="210" text-anchor="middle" font-size="10" fill="#7d8590">Task decomposition · Spatial reasoning</text>

  <!-- Arrow to VLA -->
  <line x1="330" y1="220" x2="330" y2="250" stroke="#7d8590" stroke-width="1.5"/>
  <polygon points="330,255 326,248 334,248" fill="#7d8590"/>

  <!-- ============ VLA POLICY ============ -->
  <rect x="180" y="255" width="300" height="50" rx="8" fill="#1c2333" stroke="#3498DB" stroke-width="2.5"/>
  <text x="330" y="278" text-anchor="middle" font-size="14" fill="#3498DB" font-weight="700">VLA Policy</text>
  <text x="330" y="295" text-anchor="middle" font-size="10" fill="#7d8590">Flow Matching: π0 · SmolVLA  ·  Token: OpenVLA  ·  Diffusion: Octo</text>

  <!-- Arrow to Adapter -->
  <line x1="330" y1="305" x2="330" y2="335" stroke="#7d8590" stroke-width="1.5"/>
  <polygon points="330,340 326,333 334,333" fill="#7d8590"/>

  <!-- ============ ROBOT ADAPTER + CONTROLLER + SAFETY ============ -->
  <rect x="80" y="340" width="160" height="42" rx="8" fill="#1c2333" stroke="#2ECC71" stroke-width="2"/>
  <text x="160" y="361" text-anchor="middle" font-size="12" fill="#2ECC71" font-weight="600">Robot Adapter</text>
  <text x="160" y="375" text-anchor="middle" font-size="9" fill="#7d8590">Generic → Specific</text>

  <rect x="260" y="340" width="160" height="42" rx="8" fill="#1c2333" stroke="#F39C12" stroke-width="2"/>
  <text x="340" y="361" text-anchor="middle" font-size="12" fill="#F39C12" font-weight="600">Controller</text>
  <text x="340" y="375" text-anchor="middle" font-size="9" fill="#7d8590">PID · Impedance · 25Hz</text>

  <rect x="440" y="340" width="160" height="42" rx="8" fill="#1c2333" stroke="#E74C3C" stroke-width="2"/>
  <text x="520" y="361" text-anchor="middle" font-size="12" fill="#E74C3C" font-weight="600">Safety Filter</text>
  <text x="520" y="375" text-anchor="middle" font-size="9" fill="#7d8590">Limits · Collision · Velocity</text>

  <!-- Arrows -->
  <line x1="240" y1="361" x2="260" y2="361" stroke="#7d8590" stroke-width="1.5"/>
  <polygon points="258,361 252,357 252,365" fill="#7d8590"/>
  <line x1="420" y1="361" x2="440" y2="361" stroke="#7d8590" stroke-width="1.5"/>
  <polygon points="438,361 432,357 432,365" fill="#7d8590"/>

  <!-- Arrow to Robot -->
  <line x1="520" y1="382" x2="520" y2="412" stroke="#7d8590" stroke-width="1.5"/>
  <polygon points="520,417 516,410 524,410" fill="#7d8590"/>

  <!-- ============ SIMULATION / REAL ROBOT ============ -->
  <rect x="360" y="417" width="320" height="48" rx="8" fill="#1c2333" stroke="#1ABC9C" stroke-width="2.5"/>
  <text x="520" y="440" text-anchor="middle" font-size="14" fill="#1ABC9C" font-weight="600">Simulation / Real Robot</text>
  <text x="520" y="456" text-anchor="middle" font-size="10" fill="#7d8590">MuJoCo · PushCube · Franka · UR5e</text>

  <!-- ============ FEEDBACK LOOPS ============ -->
  <!-- World Model feedback -->
  <rect x="620" y="170" width="200" height="42" rx="8" fill="#1c2333" stroke="#95A5A6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="720" y="188" text-anchor="middle" font-size="12" fill="#95A5A6" font-weight="600">World Model</text>
  <text x="720" y="202" text-anchor="middle" font-size="9" fill="#7d8590">Predict future · Reward · Risk</text>

  <!-- RL Post-training -->
  <rect x="620" y="255" width="200" height="42" rx="8" fill="#1c2333" stroke="#95A5A6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="720" y="273" text-anchor="middle" font-size="12" fill="#95A5A6" font-weight="600">RL Post-training</text>
  <text x="720" y="287" text-anchor="middle" font-size="9" fill="#7d8590">PPO · Policy optimization</text>

  <!-- Feedback arrows (dashed) -->
  <path d="M 680 417 Q 680 380 680 212" stroke="#95A5A6" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <polygon points="680,212 676,219 684,219" fill="#95A5A6"/>
  <text x="660" y="380" text-anchor="end" font-size="9" fill="#7d8590" transform="rotate(-90 660 380)">WM feedback</text>

  <path d="M 720 417 Q 720 350 720 297" stroke="#95A5A6" stroke-width="1.5" fill="none" stroke-dasharray="4,3"/>
  <polygon points="720,297 716,304 724,304" fill="#95A5A6"/>
  <text x="740" y="350" text-anchor="start" font-size="9" fill="#7d8590" transform="rotate(-90 740 350)">RL feedback</text>

  <!-- Arrow from VLA to World Model (prediction input) -->
  <line x1="480" y1="280" x2="620" y2="191" stroke="#95A5A6" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Arrow from Robot to RL -->
  <line x1="680" y1="417" x2="720" y2="297" stroke="#95A5A6" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- ============ FOUNDATIONS LAYER ============ -->
  <rect x="60" y="417" width="280" height="48" rx="8" fill="#1c2333" stroke="#58A6FF" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="200" y="440" text-anchor="middle" font-size="13" fill="#58A6FF" font-weight="600">Foundations Layer</text>
  <text x="200" y="456" text-anchor="middle" font-size="10" fill="#7d8590">Python · Math · DL · Transformer · FK/IK · Control · MuJoCo</text>

  <!-- Arrow from Foundations up to Reasoner (supports) -->
  <line x1="200" y1="417" x2="200" y2="220" stroke="#58A6FF" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>

  <!-- Footer -->
  <text x="450" y="500" text-anchor="middle" font-size="9" fill="#484f58">Embodied AI: Zero to Hero · github.com/Dld0621/Embodied-AI-Zero-to-Hero</text>
</svg>
