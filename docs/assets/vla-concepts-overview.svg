<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1490" role="img" aria-labelledby="title desc">
<title id="title">同一套 VLA 的十个观察视角</title><desc id="desc">十个并行的分类视角：类别、功能、结构、内部、组件、数据、动作、训练、执行和评测。它们描述同一个系统的不同方面，不是互斥分支或继承树。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#2563eb" stroke-width="1.5"/></marker></defs>
<rect width="560" height="1490" rx="18" fill="#fff"/>
<g font-family="system-ui,-apple-system,BlinkMacSystemFont,sans-serif" fill="#183449"><text x="280" y="45" font-size="28" font-weight="700" text-anchor="middle">同一套 VLA，十个观察视角</text><text x="280" y="82" font-size="22" text-anchor="middle">遇到新名词，先问它回答什么问题</text><rect x="32" y="107" width="496" height="78" rx="12" fill="#183449" stroke="#183449"/><text x="280" y="139" font-size="25" font-weight="700" text-anchor="middle" fill="#fff">任务：把红杯放到左托盘</text><text x="280" y="168" font-size="22" text-anchor="middle" fill="#fff">每一行都可以描述这个系统</text><rect x="32" y="205" width="496" height="110" rx="12" fill="#f0f5fc" stroke="#b4c4d4"/><text x="50" y="237" font-size="23" font-weight="700" text-anchor="start" fill="#2563eb">01</text><text x="101" y="237" font-size="25" font-weight="700" text-anchor="start">模型类别</text><text x="50" y="272" font-size="23" text-anchor="start">它解决什么问题？</text><text x="50" y="301" font-size="21" text-anchor="start" fill="#476078">VLA · policy · world model</text><rect x="32" y="327" width="496" height="110" rx="12" fill="#f7f4fc" stroke="#b4c4d4"/><text x="50" y="359" font-size="23" font-weight="700" text-anchor="start" fill="#2563eb">02</text><text x="101" y="359" font-size="25" font-weight="700" text-anchor="start">功能模块</text><text x="50" y="394" font-size="23" text-anchor="start">它负责哪一段工作？</text><text x="50" y="423" font-size="21" text-anchor="start" fill="#476078">encoder · backbone · head</text><rect x="32" y="449" width="496" height="110" rx="12" fill="#f0f5fc" stroke="#b4c4d4"/><text x="50" y="481" font-size="23" font-weight="700" text-anchor="start" fill="#2563eb">03</text><text x="101" y="481" font-size="25" font-weight="700" text-anchor="start">网络结构</text><text x="50" y="516" font-size="23" text-anchor="start">它怎样搭建？</text><text x="50" y="545" font-size="21" text-anchor="start" fill="#476078">MLP · CNN · Transformer · ViT</text><rect x="32" y="571" width="496" height="110" rx="12" fill="#f7f4fc" stroke="#b4c4d4"/><text x="50" y="603" font-size="23" font-weight="700" text-anchor="start" fill="#2563eb">04</text><text x="101" y="603" font-size="25" font-weight="700" text-anchor="start">网络内部</text><text x="50" y="638" font-size="23" text-anchor="start">参数与数据怎样流动？</text><text x="50" y="667" font-size="21" text-anchor="start" fill="#476078">token · Q/K/V · mask · residual</text><rect x="32" y="693" width="496" height="110" rx="12" fill="#f0f5fc" stroke="#b4c4d4"/><text x="50" y="725" font-size="23" font-weight="700" text-anchor="start" fill="#2563eb">05</text><text x="101" y="725" font-size="25" font-weight="700" text-anchor="start">具体组件</text><text x="50" y="760" font-size="23" text-anchor="start">论文选用了谁？</text><text x="50" y="789" font-size="21" text-anchor="start" fill="#476078">SigLIP · DINOv2 · PaliGemma</text><rect x="32" y="815" width="496" height="110" rx="12" fill="#f7f4fc" stroke="#b4c4d4"/><text x="50" y="847" font-size="23" font-weight="700" text-anchor="start" fill="#2563eb">06</text><text x="101" y="847" font-size="25" font-weight="700" text-anchor="start">输入与数据</text><text x="50" y="882" font-size="23" text-anchor="start">有什么信息，答案从哪里来？</text><text x="50" y="911" font-size="21" text-anchor="start" fill="#476078">RGB · state · episode · 示范</text><rect x="32" y="937" width="496" height="110" rx="12" fill="#f0f5fc" stroke="#b4c4d4"/><text x="50" y="969" font-size="23" font-weight="700" text-anchor="start" fill="#2563eb">07</text><text x="101" y="969" font-size="25" font-weight="700" text-anchor="start">动作与生成</text><text x="50" y="1004" font-size="23" text-anchor="start">数值是什么，怎样生成？</text><text x="50" y="1033" font-size="21" text-anchor="start" fill="#476078">joint/delta · chunk · flow</text><rect x="32" y="1059" width="496" height="110" rx="12" fill="#f7f4fc" stroke="#b4c4d4"/><text x="50" y="1091" font-size="23" font-weight="700" text-anchor="start" fill="#2563eb">08</text><text x="101" y="1091" font-size="25" font-weight="700" text-anchor="start">训练与监督</text><text x="50" y="1126" font-size="23" text-anchor="start">何时学、向谁学、更新谁？</text><text x="50" y="1155" font-size="21" text-anchor="start" fill="#476078">BC · LoRA · teacher · gradient</text><rect x="32" y="1181" width="496" height="110" rx="12" fill="#f0f5fc" stroke="#b4c4d4"/><text x="50" y="1213" font-size="23" font-weight="700" text-anchor="start" fill="#2563eb">09</text><text x="101" y="1213" font-size="25" font-weight="700" text-anchor="start">软件与执行</text><text x="50" y="1248" font-size="23" text-anchor="start">怎样从代码变成运动？</text><text x="50" y="1277" font-size="21" text-anchor="start" fill="#476078">PyTorch · openpi · IK · controller</text><rect x="32" y="1303" width="496" height="110" rx="12" fill="#f7f4fc" stroke="#b4c4d4"/><text x="50" y="1335" font-size="23" font-weight="700" text-anchor="start" fill="#2563eb">10</text><text x="101" y="1335" font-size="25" font-weight="700" text-anchor="start">评测与泛化</text><text x="50" y="1370" font-size="23" text-anchor="start">改进在什么条件下成立？</text><text x="50" y="1399" font-size="21" text-anchor="start" fill="#476078">benchmark · OOD · ablation</text><text x="280" y="1460" font-size="22" font-weight="700" text-anchor="middle">多个标签可以同时成立，不必十选一。</text></g></svg>
