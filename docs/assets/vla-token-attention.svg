<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1320" role="img" aria-labelledby="title desc">
<title id="title">Token、参数、注意力与残差</title><desc id="desc">输入形成token特征X；推理时固定的投影参数产生随输入变化的Q、K、V；匹配、mask、softmax后得到注意力权重P，再对V加权。残差与FFN是后续网络模块。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#2563eb" stroke-width="1.5"/></marker></defs>
<rect width="560" height="1320" rx="18" fill="#fff"/>
<g font-family="system-ui,-apple-system,BlinkMacSystemFont,sans-serif" fill="#183449"><text x="280" y="44" font-size="28" font-weight="700" text-anchor="middle">参数固定，当前特征仍会变化</text><rect x="32" y="75" width="496" height="93" rx="12" fill="#edf4fd" stroke="#a1bad5"/><text x="280" y="111" font-size="25" font-weight="700" text-anchor="middle">当前输入 → token 特征 X</text><text x="280" y="146" font-size="22" text-anchor="middle">教学尺寸：3 个位置 × 2 个特征</text><path d="M280 170L280 200" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="214" width="496" height="86" rx="12" fill="#fff3e1" stroke="#c69756"/><text x="280" y="248" font-size="25" font-weight="700" text-anchor="middle">投影参数 WQ、WK、WV</text><text x="280" y="283" font-size="22" text-anchor="middle">通常由训练学习；本次推理保持固定</text><path d="M280 302L280 332" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="346" width="152" height="81" rx="12" fill="#edf4fd" stroke="#a1bad5"/><text x="108" y="378" font-size="21" font-weight="700" text-anchor="middle">Q：查询表示</text><text x="108" y="410" font-size="21" text-anchor="middle">随 X 改变</text><rect x="204" y="346" width="152" height="81" rx="12" fill="#edf4fd" stroke="#a1bad5"/><text x="280" y="378" font-size="21" font-weight="700" text-anchor="middle">K：匹配表示</text><text x="280" y="410" font-size="21" text-anchor="middle">随 X 改变</text><rect x="376" y="346" width="152" height="81" rx="12" fill="#edf4fd" stroke="#a1bad5"/><text x="452" y="378" font-size="21" font-weight="700" text-anchor="middle">V：读取内容</text><text x="452" y="410" font-size="21" text-anchor="middle">随 X 改变</text><path d="M280 429L280 460" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="474" width="496" height="100" rx="12" fill="#f3effb" stroke="#b3a4ce"/><text x="280" y="511" font-size="24" font-weight="700" text-anchor="middle">Q 与 K 匹配 → 分数矩阵</text><text x="280" y="548" font-size="22" text-anchor="middle">mask 决定允许读取哪些位置</text><path d="M280 576L280 606" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="620" width="496" height="132" rx="12" fill="#edf4fd" stroke="#a1bad5"/><text x="280" y="658" font-size="25" font-weight="700" text-anchor="middle">softmax → 当前权重 P</text><rect x="72" y="678" width="84" height="33" rx="5" fill="#81a9ed"/><text x="114.0" y="702" font-size="21" font-weight="700" text-anchor="middle">0.2</text><rect x="173" y="678" width="126" height="33" rx="5" fill="#81a9ed"/><text x="236.0" y="702" font-size="21" font-weight="700" text-anchor="middle">0.3</text><rect x="316" y="678" width="210" height="33" rx="5" fill="#81a9ed"/><text x="421.0" y="702" font-size="21" font-weight="700" text-anchor="middle">0.5</text><text x="280" y="738" font-size="21" text-anchor="middle">一行教学权重，和为 1</text><path d="M280 754L280 785" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="799" width="496" height="110" rx="12" fill="#edf4fd" stroke="#a1bad5"/><text x="280" y="837" font-size="25" font-weight="700" text-anchor="middle">P 对 V 加权汇总 → O</text><text x="280" y="875" font-size="23" text-anchor="middle">V 的一列 [1,2,4] → 输出 2.8</text><path d="M280 911L280 941" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="955" width="496" height="102" rx="12" fill="#eaf5ee" stroke="#8eaf9a"/><text x="280" y="994" font-size="25" font-weight="700" text-anchor="middle">残差连接 / Norm / FFN</text><text x="280" y="1030" font-size="22" text-anchor="middle">按实际 block 顺序进一步计算</text><rect x="32" y="1090" width="496" height="175" rx="12" fill="#f6f7f9" stroke="#aab7c4"/><text x="280" y="1127" font-size="25" font-weight="700" text-anchor="middle">分清三件事</text><text x="280" y="1165" font-size="22" text-anchor="middle">WQ 是参数；Q 和 P 是当前激活。</text><text x="280" y="1201" font-size="22" text-anchor="middle">token 不保证对应一个物体。</text><text x="280" y="1237" font-size="22" text-anchor="middle">高注意力权重不证明因果理解。</text></g></svg>
