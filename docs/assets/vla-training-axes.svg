<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1090" role="img" aria-labelledby="title desc">
<title id="title">训练的四条独立分类轴</title><desc id="desc">训练阶段、学习信号、参数更新范围和优化过程是四条独立轴。一次任务适配可以同时采用行为克隆和LoRA。教师是提供监督的角色，其预测不自动是真值。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#2563eb" stroke-width="1.5"/></marker></defs>
<rect width="560" height="1090" rx="18" fill="#fff"/>
<g font-family="system-ui,-apple-system,BlinkMacSystemFont,sans-serif" fill="#183449"><text x="280" y="45" font-size="28" font-weight="700" text-anchor="middle">说“用了 LoRA”，还没说完整</text><text x="280" y="83" font-size="24" text-anchor="middle">训练至少要分别填四行</text><rect x="32" y="116" width="496" height="135" rx="12" fill="#edf4fd" stroke="#a1bad5"/><text x="53" y="153" font-size="26" font-weight="700" text-anchor="start">1 阶段</text><text x="53" y="192" font-size="23" text-anchor="start">从什么权重，为何继续学习？</text><text x="53" y="228" font-size="22" text-anchor="start">预训练 / 持续预训练 / 后训练</text><rect x="32" y="271" width="496" height="135" rx="12" fill="#f3effb" stroke="#b3a4ce"/><text x="53" y="308" font-size="26" font-weight="700" text-anchor="start">2 学习信号</text><text x="53" y="347" font-size="23" text-anchor="start">什么信息告诉模型应该怎样改？</text><text x="53" y="383" font-size="22" text-anchor="start">BC / 自监督 / RL / 教师特征</text><rect x="32" y="426" width="496" height="135" rx="12" fill="#fff3e1" stroke="#c69756"/><text x="53" y="463" font-size="26" font-weight="700" text-anchor="start">3 参数范围</text><text x="53" y="502" font-size="23" text-anchor="start">哪些参数真的会更新？</text><text x="53" y="538" font-size="22" text-anchor="start">全量 / freeze / head-only / LoRA</text><rect x="32" y="581" width="496" height="135" rx="12" fill="#eaf5ee" stroke="#8eaf9a"/><text x="53" y="618" font-size="26" font-weight="700" text-anchor="start">4 优化过程</text><text x="53" y="657" font-size="23" text-anchor="start">怎样计算目标并完成更新？</text><text x="53" y="693" font-size="22" text-anchor="start">batch → loss → 梯度 → optimizer</text><rect x="32" y="761" width="496" height="110" rx="12" fill="#183449" stroke="#183449"/><text x="280" y="802" font-size="25" font-weight="700" text-anchor="middle" fill="#fff">一次训练可以同时是：</text><text x="280" y="842" font-size="23" text-anchor="middle" fill="#fff">任务适配 + BC + LoRA + AdamW</text><rect x="32" y="902" width="496" height="144" rx="12" fill="#f6f7f9" stroke="#aab7c4"/><text x="280" y="938" font-size="25" font-weight="700" text-anchor="middle">监督来源另外追溯</text><text x="280" y="975" font-size="22" text-anchor="middle">测量 / 人工 / 仿真 / 教师 / 伪标签</text><text x="280" y="1013" font-size="22" text-anchor="middle">Teacher 是角色，预测不自动等于 GT。</text></g></svg>
