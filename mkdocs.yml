site_name: Embodied AI · Zero to Hero
site_description: Bilingual foundations, pipelines, runnable baselines, and evidence for embodied intelligence.
site_url: https://dld0621.github.io/Embodied-AI-Zero-to-Hero/
repo_url: https://github.com/Dld0621/Embodied-AI-Zero-to-Hero
repo_name: Dld0621/Embodied-AI-Zero-to-Hero
docs_dir: docs
site_dir: site
strict: true
exclude_docs: |
  /README.md

theme:
  name: material
  custom_dir: docs/overrides
  language: zh
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/extra.css
  - stylesheets/learning-lab.css
  - stylesheets/knowledge-atlas.css
  - stylesheets/learning-shell.css

extra_javascript:
  - javascripts/lab-models.js
  - javascripts/learning-lab.js
  - javascripts/learning-shell.js

hooks:
  - scripts/mkdocs_math.py
  - scripts/check_site_math.py
  - scripts/check_site_atlas.py
  - scripts/check_site_learning_shell.py

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true

validation:
  nav:
    omitted_files: ignore
  links:
    # Repository-local paths intentionally point outside docs_dir. The
    # dedicated link checker resolves those paths from the Git worktree.
    not_found: ignore
    anchors: ignore
    absolute_links: ignore
    unrecognized_links: ignore

