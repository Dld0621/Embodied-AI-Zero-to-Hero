site_name: Embodied AI · Zero to Hero
site_description: Bilingual foundations, pipelines, runnable baselines, and evidence for embodied intelligence.
site_url: https://dld0621.github.io/Embodied-AI-Zero-to-Hero/
repo_url: https://github.com/Dld0621/Embodied-AI-Zero-to-Hero
repo_name: Dld0621/Embodied-AI-Zero-to-Hero
docs_dir: docs
site_dir: site
strict: true
exclude_docs: |
  /README.md

theme:
  name: material
  language: en
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/extra.css
  - stylesheets/learning-lab.css

extra_javascript:
  - javascripts/lab-models.js
  - javascripts/learning-lab.js
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true

validation:
  nav:
    omitted_files: ignore
  links:
    # Repository-local paths intentionally point outside docs_dir. The
    # dedicated link checker resolves those paths from the Git worktree.
    not_found: ignore
    anchors: ignore
    absolute_links: ignore
    unrecognized_links: ignore

nav:
  - Home: index.md
  - 中文: index_cn.md
  - Start here:
      - English: start-here.md
      - 简体中文: start-here-cn.md
  - Learning lab:
      - 交互实验室: learning-lab-cn.md
      - Interactive experiments: learning-lab.md
  - Curriculum:
      - English: curriculum.md
      - 简体中文: curriculum_cn.md
      - Assessment: assessment.md
      - 统一评估: assessment-cn.md
      - Capstones: capstone.md
      - 三级毕业项目: capstone-cn.md
      - 100-point audit: CURRICULUM_AUDIT.md
      - 100 分课程审查: CURRICULUM_AUDIT_CN.md
  - VLA and WAM:
      - Specialization overview: specializations/README.md
      - 中文专项总览: specializations/README_CN.md
      - VLA Zero to One: specializations/vla-zero-to-one.md
