[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["pretrained/anyteleop/frankmocap"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
omit = ["pretrained/*", "tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
